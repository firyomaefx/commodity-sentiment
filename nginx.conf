# nginx reverse proxy: serve static landing.html on /, proxy /dashboard to Streamlit
server {
    listen 80;
    server_name localhost;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "ok";
    }

    # Static landing page (SEO + LLM readable)
    location = / {
        root /app;
        index landing.html;
        try_files /landing.html =404;
    }

    # Streamlit dashboard (existing app)
    location /dashboard {
        proxy_pass http://127.0.0.1:7860/dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Streamlit WebSocket support
    location /dashboard/_stcore/stream {
        proxy_pass http://127.0.0.1:7860/dashboard/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /dashboard/_stcore/health {
        proxy_pass http://127.0.0.1:7860/dashboard/_stcore/health;
    }

    location /dashboard/_stcore/allowed-message-origins {
        proxy_pass http://127.0.0.1:7860/dashboard/_stcore/allowed-message-origins;
    }

    # Fallback for any Streamlit internal paths under /dashboard
    location /dashboard/ {
        proxy_pass http://127.0.0.1:7860/dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
