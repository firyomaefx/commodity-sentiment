[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10

[program:streamlit]
command=streamlit run dashboard.py --server.port=7860 --server.address=127.0.0.1 --server.baseUrlPath=/dashboard
autostart=true
autorestart=true
priority=20
stderr_logfile=/var/log/supervisor/streamlit.err.log
stdout_logfile=/var/log/supervisor/streamlit.out.log

[program:landing-builder]
command=python /app/build_landing.py
autostart=true
autorestart=unexpected
startsecs=30
exitcodes=0
stderr_logfile=/var/log/supervisor/landing.err.log
stdout_logfile=/var/log/supervisor/landing.out.log
